name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install pytest pytest-asyncio pytest-cov ruff mypy
          pip install -e "."

      - name: Lint with ruff
        run: |
          ruff check reconprobe/ tests/

      - name: Type-check with mypy
        run: |
          mypy reconprobe/ --ignore-missing-imports --no-strict-optional || true

      - name: Test with pytest (coverage)
        run: |
          python -m pytest tests/ -v --tb=short -q \
            --cov=reconprobe \
            --cov-report=xml \
            --cov-report=term-missing \
            -m 'not docker'

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: pytest
          name: reconprobe-coverage
          fail_ci_if_error: false

      - name: Verify Docker build
        if: matrix.python-version == '3.11'
        run: |
          docker build -t reconprobe:ci -f Dockerfile .

  docker-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Extract version tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "VERSION_TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION_TAG=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.get_version.outputs.VERSION_TAG || '0.9.0' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Tag and push version image (for releases)
        if: steps.get_version.outputs.VERSION_TAG != ''
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:v${{ steps.get_version.outputs.VERSION_TAG }}
          docker push ghcr.io/${{ github.repository }}:v${{ steps.get_version.outputs.VERSION_TAG }}
