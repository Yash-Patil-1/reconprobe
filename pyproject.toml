[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "reconprobe"
version = "0.7.0"
description = "Automated reconnaissance tool for penetration testing"
authors = [{name = "Yash Patil"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    # Phase 6: Reporting Automation
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    # Phase 7: CI/CD & Automation
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "aiohttp>=3.9",
    "aiosmtplib>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
reconprobe = "reconprobe.cli:main"

[tool.setuptools.packages.find]
include = ["reconprobe*"]
