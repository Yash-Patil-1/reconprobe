[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconprobe"
version = "0.9.0"
description = "Automated reconnaissance tool for penetration testing"
readme = "README.md"
license = "MIT"
authors = [{name = "Yash Patil"}]
keywords = ["security", "pentesting", "reconnaissance", "osint", "vulnerability-scanning", "penetration-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Yash-Patil-1/reconprobe"
Repository = "https://github.com/Yash-Patil-1/reconprobe"
Documentation = "https://github.com/Yash-Patil-1/reconprobe#readme"
"Issues" = "https://github.com/Yash-Patil-1/reconprobe/issues"
"Changelog" = "https://github.com/Yash-Patil-1/reconprobe/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/Yash-Patil-1/reconprobe/releases"

[project.scripts]
reconprobe = "reconprobe.cli:main"

[project.optional-dependencies]
# Playwright — browser automation for screenshots (requires `playwright install`)
screenshots = ["playwright>=1.40"]

# Reporting — PDF generation (fpdf2) and Excel export (openpyxl)
reporting = ["fpdf2>=2.7", "openpyxl>=3.1"]

# API — FastAPI REST server for remote scanning
api = ["fastapi>=0.100", "uvicorn>=0.24"]

# Webhooks — async HTTP client for Slack/Discord notifications
webhooks = ["aiohttp>=3.9"]

# Install everything
full = [
    "reconprobe[screenshots,reporting,api,webhooks]",
]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.11",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

[tool.coverage.run]
source = ["reconprobe"]
omit = ["*/__pycache__/*", "*.venv/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: Integration tests against a live test server",
    "docker: Docker build and run tests (requires Docker daemon)",
]
filterwarnings = [
    # Asyncio + AsyncMock can trigger GC warnings for coroutines
    # that were properly awaited via wait_for. This is a known
    # false positive in the pytest-asyncio + AsyncMock interaction.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.setuptools.packages.find]
include = ["reconprobe*"]
