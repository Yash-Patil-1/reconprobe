[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "reconprobe"
version = "1.0.0"
description = "Automated reconnaissance tool for penetration testing"
authors = [{name = "Yash Patil"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    # Phase 6: Reporting Automation
    "fpdf2>=2.7",
    "openpyxl>=3.1",
    # Phase 7: CI/CD & Automation
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "aiohttp>=3.9",
    "aiosmtplib>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
reconprobe = "reconprobe.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.11",
    "pyright>=1.1",
    "pre-commit>=3.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Asyncio + AsyncMock can trigger GC warnings for coroutines
    # that were properly awaited via wait_for. This is a known
    # false positive in the pytest-asyncio + AsyncMock interaction.
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.setuptools.packages.find]
include = ["reconprobe*"]
